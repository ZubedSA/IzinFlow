name: izinflow
description: Satu Platform, Banyak Lembaga. Digital Permission System for Schools & Madrasahs.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.3.6
  riverpod_annotation: ^2.1.1

  # Navigation & Routing
  go_router: ^10.0.0

  # Networking
  dio: ^5.2.1

  # Core UI & Style
  google_fonts: ^6.1.0
  intl: ^0.18.1
  flutter_spinkit: ^5.2.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3

  # Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Codegen
  build_runner: ^2.4.6
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  riverpod_generator: ^2.2.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
